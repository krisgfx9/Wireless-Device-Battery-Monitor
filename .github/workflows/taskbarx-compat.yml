name: TaskbarX compatibility test build

on:
  push:
    branches:
      - compat/taskbarx-safe-mode

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make
      - name: Build
        shell: msys2 {0}
        run: make
      - name: Tests
        shell: msys2 {0}
        run: make test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WirelessBattery-taskbarx-compat
          path: dist/*
